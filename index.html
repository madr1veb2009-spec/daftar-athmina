<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>دفتر أثمنة السلع</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1F4B46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر الأثمنة">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --paper:#FBF6EA;
    --paper-2:#F3ECD9;
    --ink:#1F4B46;
    --ink-soft:#3F6B64;
    --mustard:#E4A538;
    --mustard-dark:#B97C1F;
    --up:#B23A2E;
    --down:#2F7D5B;
    --line: rgba(31,75,70,0.18);
    --shadow-ink: rgba(31,75,70,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal', system-ui, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(31,75,70,0.06) 1px, transparent 1px);
    background-size: 18px 18px;
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:18px 16px 48px;
  }

  header.top{
    padding:6px 2px 18px;
  }
  header.top .eyebrow-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }
  h1{
    font-size:26px;
    font-weight:800;
    margin:0;
    letter-spacing:0;
    color:var(--ink);
  }
  .stamp{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:500;
    white-space:nowrap;
    border:1px dashed var(--line);
    border-radius:100px;
    padding:3px 10px;
  }
  header.top p.sub{
    margin:6px 0 0;
    font-size:14.5px;
    color:var(--ink-soft);
    line-height:1.6;
  }

  .search-shell{
    position:sticky;
    top:12px;
    z-index:5;
    margin-top:16px;
  }
  .search-box{
    position:relative;
    background:#fff;
    border:2px solid var(--ink);
    border-radius:14px;
    box-shadow:3px 3px 0 var(--ink);
    display:flex;
    align-items:center;
    padding:0 14px;
  }
  .search-box svg{flex:0 0 auto; opacity:0.65;}
  .search-box input{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    font-family:inherit;
    font-size:18px;
    font-weight:500;
    color:var(--ink);
    padding:14px 10px;
    min-width:0;
  }
  .search-box input::placeholder{color:#9AAFA9;}
  .clear-btn{
    border:0;
    background:var(--paper-2);
    color:var(--ink-soft);
    width:26px;height:26px;
    border-radius:50%;
    font-size:15px;
    line-height:1;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .clear-btn.show{display:flex;}

  .filters{
    display:flex;
    gap:8px;
    margin-top:12px;
    overflow-x:auto;
    padding-bottom:4px;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:13.5px;
    font-weight:500;
    padding:7px 14px;
    border-radius:100px;
    cursor:pointer;
    white-space:nowrap;
  }
  .chip .dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    margin-inline-start:6px;
    vertical-align:middle;
  }
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }

  .status-line{
    margin:16px 2px 10px;
    font-size:14px;
    color:var(--ink-soft);
    font-weight:500;
    min-height:20px;
  }
  .status-line b{color:var(--ink); font-weight:700;}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:34px; display:block; margin-bottom:10px;}
  .empty-state p{margin:0; font-size:15px; line-height:1.7;}

  .results{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .tag{
    position:relative;
    background:#fff;
    border:1.5px solid var(--line);
    border-inline-start-width:6px;
    border-inline-start-color: var(--src-color, var(--ink));
    border-radius:10px;
    padding:13px 16px 13px 16px;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .tag:active{border-color:var(--ink); border-inline-start-color:var(--src-color, var(--ink));}
  .tag.open{border-color:var(--ink); border-inline-start-color:var(--src-color, var(--ink)); box-shadow:2px 2px 0 var(--shadow-ink);}

  .tag::before{
    content:"";
    position:absolute;
    inset-inline-start:-1.5px;
    top:50%;
    transform:translateY(-50%);
    width:11px;height:11px;
    background:var(--src-color, var(--paper));
    border:1.5px solid var(--paper);
    border-radius:50%;
  }

  .tag-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .tag-name{
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    line-height:1.4;
  }
  .tag-price{
    font-size:19px;
    font-weight:800;
    color:var(--mustard-dark);
    white-space:nowrap;
  }
  .tag-price small{font-size:12px; font-weight:500; color:var(--ink-soft);}

  .tag-meta{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:6px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .src-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .tag-meta .sep{opacity:0.4;}

  .history{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .tag.open .history{max-height:600px;}
  .history-inner{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
  }
  .history-title{
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .hist-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 0;
    font-size:13.5px;
  }
  .hist-row + .hist-row{border-top:1px solid rgba(31,75,70,0.08);}
  .hist-left{display:flex; align-items:center; gap:7px; color:var(--ink-soft);}
  .hist-price{display:flex; align-items:center; gap:6px; font-weight:700; color:var(--ink);}
  .trend{font-size:12px; font-weight:800;}
  .trend.up{color:var(--up);}
  .trend.down{color:var(--down);}
  .trend.flat{color:#B7B09A;}

  .score-badge{
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
    background:var(--paper-2);
    border-radius:100px;
    padding:1px 8px;
  }

  footer.hint{
    text-align:center;
    margin-top:26px;
    font-size:12px;
    color:#A9A28A;
    line-height:1.8;
  }

  .fab{
    position:fixed;
    inset-inline-end:20px;
    bottom:22px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--mustard);
    border:2px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    color:var(--ink);
    font-size:28px;
    font-weight:800;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:20;
  }
  .fab:active{ transform:translateY(1px); box-shadow:2px 2px 0 var(--ink);}

  .sheet-overlay{
    position:fixed; inset:0;
    background:rgba(31,75,70,0.35);
    z-index:30;
    display:none;
    align-items:flex-end;
    justify-content:center;
  }
  .sheet-overlay.show{display:flex;}
  .sheet{
    width:100%;
    max-width:640px;
    background:var(--paper);
    border-radius:18px 18px 0 0;
    border:2px solid var(--ink);
    border-bottom:none;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:85vh;
    overflow-y:auto;
  }
  .sheet h2{
    margin:0 0 14px;
    font-size:18px;
    font-weight:800;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input, .field select{
    width:100%;
    font-family:inherit;
    font-size:15.5px;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:#fff;
    color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--mustard); border-color:var(--ink);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .btn{
    flex:1;
    padding:12px;
    border-radius:10px;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    border:2px solid var(--ink);
    cursor:pointer;
  }
  .btn.primary{background:var(--ink); color:#fff;}
  .btn.ghost{background:transparent; color:var(--ink);}

  .storage-warn{
    font-size:12px;
    color:var(--up);
    background:rgba(178,58,46,0.08);
    border:1px solid rgba(178,58,46,0.25);
    border-radius:8px;
    padding:8px 10px;
    margin-bottom:12px;
    line-height:1.6;
  }

  .custom-badge{
    font-size:10.5px;
    font-weight:700;
    color:var(--mustard-dark);
    background:rgba(228,165,56,0.15);
    border-radius:100px;
    padding:1px 8px;
  }
  .del-btn{
    border:0;
    background:transparent;
    color:var(--up);
    font-size:15px;
    cursor:pointer;
    padding:2px 4px;
    margin-inline-start:auto;
  }

  .scan-row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
  }
  .scan-row input[type="text"]{
    flex:1.4;
    font-family:inherit;
    font-size:14.5px;
    padding:9px 10px;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    min-width:0;
  }
  .scan-row input[type="number"]{
    flex:0.8;
    font-family:inherit;
    font-size:14.5px;
    padding:9px 10px;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    min-width:0;
  }
  .scan-row .row-del{
    flex:0 0 auto;
    border:0;
    background:transparent;
    color:var(--up);
    font-size:17px;
    cursor:pointer;
    padding:4px 6px;
  }
  .scan-loading{
    text-align:center;
    padding:26px 10px;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .spinner{
    width:30px;height:30px;
    border:3px solid var(--line);
    border-top-color:var(--ink);
    border-radius:50%;
    margin:0 auto 12px;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .scan-error{
    font-size:13.5px;
    color:var(--up);
    background:rgba(178,58,46,0.08);
    border:1px solid rgba(178,58,46,0.25);
    border-radius:8px;
    padding:10px 12px;
    line-height:1.7;
  }

  @media (min-width:520px){
    h1{font-size:29px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow-row">
      <h1>🧾 دفتر أثمنة السلع</h1>
      <span class="stamp" id="statsStamp">…</span>
    </div>
    <p class="sub">كتب سمية أي سلعة، وغادي تلقى آخر ثمن ديالها وتاريخ الشراء، حتى ولو كتبتي الاسم بغلطة أو بطريقة أخرى.</p>
  </header>

  <div class="search-shell">
    <div class="search-box">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="اكتب سمية السلعة هنا…" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="clear-btn" id="clearBtn" aria-label="مسح">✕</button>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <div class="status-line" id="statusLine"></div>
  <div id="resultsHolder"></div>

  <footer class="hint">دفتر الأسعار ديالك، خدام فالتليفون بلا أنترنت.</footer>
</div>

<button class="fab" id="fabScan" aria-label="صور بون" style="bottom:88px; background:var(--paper); color:var(--ink);">📷</button>
<input type="file" id="scanInput" accept="image/*" capture="environment" style="display:none;">
<button class="fab" id="fabAdd" aria-label="زيد سلعة">+</button>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">
    <h2>➕ زيد سلعة جديدة</h2>
    <div id="storageWarnHolder"></div>
    <div class="field">
      <label>سمية السلعة</label>
      <input type="text" id="fName" placeholder="مثال: خل صغير">
    </div>
    <div class="field-row">
      <div class="field">
        <label>الثمن (درهم)</label>
        <input type="number" id="fPrice" step="0.01" inputmode="decimal" placeholder="0.00">
      </div>
      <div class="field">
        <label>التاريخ</label>
        <input type="date" id="fDate">
      </div>
    </div>
    <div class="field">
      <label>المصدر</label>
      <select id="fSource"></select>
    </div>
    <div class="field" id="newSourceField" style="display:none;">
      <label>سمية المصدر الجديد</label>
      <input type="text" id="fNewSource" placeholder="مثال: سلعة السوق">
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelAdd">إلغاء</button>
      <button class="btn primary" id="saveAdd">حفظ</button>
    </div>
  </div>
</div>

<div class="sheet-overlay" id="scanOverlay">
  <div class="sheet">
    <h2>📷 سلع من صورة البون</h2>
    <div id="scanBody">
      <p style="font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin-top:0;">
        القراءة الآلية ماشي دقيقة 100%، تأكد من كل سطر قبل ما تحفظ.
      </p>
    </div>
    <div class="field-row">
      <div class="field">
        <label>التاريخ (لكاع السلع)</label>
        <input type="date" id="scanDate">
      </div>
      <div class="field">
        <label>المصدر (لكاع السلع)</label>
        <select id="scanSource"></select>
      </div>
    </div>
    <div class="field" id="scanNewSourceField" style="display:none;">
      <label>سمية المصدر الجديد</label>
      <input type="text" id="scanNewSource" placeholder="مثال: سلعة السوق">
    </div>
    <button class="btn ghost" id="scanAddRow" style="width:100%; margin-bottom:12px;">➕ زيد سطر يدوي</button>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelScan">إلغاء</button>
      <button class="btn primary" id="saveScan">زيد الكل</button>
    </div>
  </div>
</div>

  if(!storageOK) return false;

// ---- date helpers ----
function parseDate(d){
  if(!d || d === '?') return null;
  const m = d.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return null;
  return new Date(+m[3], +m[2]-1, +m[1]);
}

// ---- Arabic normalization, mirroring the workbook's own logic ----
function normalize(str){
  return String(str)
    .trim()
    .replace(/[أإآ]/g,'ا')
    .replace(/[ىی]/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/ط/g,'ت')
    .replace(/ک/g,'ك')
    .replace(/\s+/g,'');
}

function bigrams(s){
  const map = new Map();
  for(let i=0;i<s.length-1;i++){
    const g = s.substr(i,2);
    map.set(g, (map.get(g)||0)+1);
  }
  return map;
}
function diceScore(a,b){
  if(a.length<2 || b.length<2) return a===b ? 100 : 0;
  const ba = bigrams(a), bb = bigrams(b);
  let inter = 0;
  for(const [g,c] of ba){
    if(bb.has(g)) inter += Math.min(c, bb.get(g));
  }
  return Math.round(2*inter/((a.length-1)+(b.length-1))*100);
}

function scoreOf(query, itemNorm){
  if(!query) return 0;
  if(query === itemNorm) return 100;
  if(itemNorm.includes(query)){
    return Math.min(99, 90 + (query.length/Math.max(itemNorm.length,1))*9);
  }
  if(itemNorm.length>=3 && query.includes(itemNorm)){
    return Math.min(94, 85 + (itemNorm.length/Math.max(query.length,1))*9);
  }
  return diceScore(query, itemNorm);
}

let ALL = [];

let SOURCE_COLORS = {};

function rebuildAll(){
  ALL = DATA.concat(customProducts);
  ALL.forEach(x=>{
    if(x._dt === undefined) x._dt = parseDate(x.d);
    if(x._norm === undefined) x._norm = normalize(x.n);
  });
  SOURCES = [...new Set(ALL.map(x=>x.s))];
  SOURCE_COLORS = {};
  SOURCES.forEach((s,i)=>SOURCE_COLORS[s]=palette[i%palette.length]);
}
rebuildAll();

function historyFor(name){
  return ALL.filter(x=>x.n===name)
    .slice()
    .sort((a,b)=>{
      if(a._dt && b._dt) return b._dt - a._dt;
      if(a._dt) return -1;
      if(b._dt) return 1;
      return 0;
    });
}

        <span class="src-dot" style="background:${SOURCE_COLORS[r.s]}"></span>
        <span>${r.s}</span><span class="sep">·</span><span>${r.d==='?'?'بلا تاريخ':r.d}</span>
        ${r.custom ? '<span class="custom-badge">زدتيها نتا</span>' : ''}
      </div>
      <div class="hist-price">${trendHtml}<span>${fmtPrice(r.p)} درهم</span>${delBtn}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function render(list, query){
  if(list.length===0){
    if(query){
      statusLine.innerHTML = `❌ ماكاينش نتيجة قريبة من «${query}»`;
      holder.innerHTML = `<div class="empty-state"><span class="glyph">🤷‍♂️</span><p>جرب تكتب سمية أقصر، أو تأكد من الكتابة.</p></div>`;
    } else {
      statusLine.textContent = '';
      holder.innerHTML = `<div class="empty-state"><span class="glyph">📭</span><p>ماكايناش سلع فهاد الفلتر.</p></div>`;
    }
    return;
  }
  statusLine.innerHTML = query
    ? `✅ كاين <b>${list.length}</b> سلعة قريبة من البحث`
    : `📦 عارض ليك <b>${list.length}</b> سلعة`;
  holder.innerHTML = `<div class="results">${list.map((r,idx)=>{
    const key = r.n+'|'+r.s+'|'+r.d+'|'+idx;
    const isOpen = openKey===r.n;
    return `<div class="tag ${isOpen?'open':''}" data-name="${encodeURIComponent(r.n)}" style="--src-color:${SOURCE_COLORS[r.s]}">
      <div class="tag-row">
        <span class="tag-name">${r.n}</span>
        <span class="tag-price">${fmtPrice(r.p)}<small> درهم</small></span>
      </div>
      <div class="tag-meta">
        <span class="src-dot" style="background:${SOURCE_COLORS[r.s]}"></span>
        <span>${r.s}</span>
        <span class="sep">·</span>
        <span>${r.d==='?'?'بلا تاريخ':r.d}</span>
        ${r.custom ? '<span class="custom-badge">زدتيها نتا</span>' : ''}
      </div>
      <div class="history">${isOpen ? renderHistory(r.n) : ''}</div>
    </div>`;
  }).join('')}</div>`;

  holder.querySelectorAll('.tag').forEach(el=>{
    el.addEventListener('click', ()=>{
      const name = decodeURIComponent(el.dataset.name);
      openKey = (openKey===name) ? null : name;
      runSearch();
    });
  });

  holder.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = btn.dataset.id;
      deleteCustomById(id);
    });
  });
}

function deleteCustomById(id){
  customProducts = customProducts.filter(x=>x._id !== id);
  saveCustom(customProducts);
  rebuildAll();
  renderChips();
  renderStamp();
  runSearch();
}

function byDateDesc(a,b){
  const ad = a._dt ? a._dt.getTime() : -Infinity;
  const bd = b._dt ? b._dt.getTime() : -Infinity;
  return bd - ad;
}

// keep only the most recent entry per exact product name, so the same
// product doesn't repeat once per price-history date in the main list
function dedupeLatest(list){
  const map = new Map();
  for(const r of list){
    const prev = map.get(r.n);
    if(!prev){
      map.set(r.n, r);
      continue;
    }
    const rd = r._dt ? r._dt.getTime() : -Infinity;
    const pd = prev._dt ? prev._dt.getTime() : -Infinity;
    if(rd > pd) map.set(r.n, r);
  }
  return Array.from(map.values());
}

function runSearch(){
  const raw = input.value;
  clearBtn.classList.toggle('show', !!raw);
  const query = normalize(raw);

  let pool = ALL;
  if(activeSource!=='الكل') pool = pool.filter(x=>x.s===activeSource);

  if(!query){
    const all = dedupeLatest(pool).sort(byDateDesc);
    render(all, '');
    return;
  }

  const scored = pool.map(x=>({...x, _score: scoreOf(query, x._norm)}))
    .filter(x=>x._score>=40);

  const deduped = dedupeLatest(scored);

  deduped.sort((a,b)=>{
    if(b._score !== a._score) return b._score - a._score;
    return byDateDesc(a,b);
  });

  render(deduped.slice(0,60), raw.trim());
}

// ---- add-product sheet ----
const fab = document.getElementById('fabAdd');
const overlay = document.getElementById('sheetOverlay');
const fName = document.getElementById('fName');
const fPrice = document.getElementById('fPrice');
const fDate = document.getElementById('fDate');
const fSource = document.getElementById('fSource');
const newSourceField = document.getElementById('newSourceField');
const fNewSource = document.getElementById('fNewSource');
const storageWarnHolder = document.getElementById('storageWarnHolder');

function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isoToDMY(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function fillSourceSelect(){
  fSource.innerHTML = SOURCES.map(s=>`<option value="${s}">${s}</option>`).join('')
    + `<option value="__new__">➕ مصدر جديد…</option>`;
}

function openSheet(){
  fillSourceSelect();
  fName.value = '';
  fPrice.value = '';
  fDate.value = todayISO();
  fNewSource.value = '';
  newSourceField.style.display = 'none';
  storageWarnHolder.innerHTML = storageOK ? '' :
    `<div class="storage-warn">⚠️ التخزين مقفول فهاد المتصفح، السلع اللي غادي تزيد غادي تضيع ملي تسد الصفحة.</div>`;
  overlay.classList.add('show');
  setTimeout(()=>fName.focus(), 50);
}
function closeSheet(){ overlay.classList.remove('show'); }

fab.addEventListener('click', openSheet);
document.getElementById('cancelAdd').addEventListener('click', closeSheet);
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeSheet(); });

fSource.addEventListener('change', ()=>{
  newSourceField.style.display = fSource.value === '__new__' ? 'block' : 'none';
  if(fSource.value === '__new__') fNewSource.focus();
});

document.getElementById('saveAdd').addEventListener('click', ()=>{
  const name = fName.value.trim();
  const price = parseFloat(fPrice.value);
  let source = fSource.value;
  if(source === '__new__'){
    source = fNewSource.value.trim();
  }
  if(!name){ fName.focus(); return; }
  if(isNaN(price) || price < 0){ fPrice.focus(); return; }
  if(!source){ fNewSource.focus(); return; }

  const dateVal = fDate.value ? isoToDMY(fDate.value) : todayISO ? isoToDMY(todayISO()) : '?';
  const rec = {
    n: name,
    s: source,
    d: dateVal,
    p: price,
    custom: true,
    _id: 'c'+Date.now()+Math.random().toString(36).slice(2,7)
  };
  customProducts.push(rec);
  saveCustom(customProducts);
  rebuildAll();
  renderChips();
  renderStamp();
  closeSheet();
  input.value = '';
  openKey = name;
  runSearch();
});


// ---- scan-receipt (free, on-device OCR via Tesseract.js) ----
const fabScan = document.getElementById('fabScan');
const scanInput = document.getElementById('scanInput');
const scanOverlay = document.getElementById('scanOverlay');
const scanBody = document.getElementById('scanBody');
const scanDate = document.getElementById('scanDate');
const scanSource = document.getElementById('scanSource');
const scanNewSourceField = document.getElementById('scanNewSourceField');
const scanNewSource = document.getElementById('scanNewSource');

let ocrWorker = null;
let scanRowId = 0;

fabScan.addEventListener('click', ()=> scanInput.click());

function fillScanSourceSelect(){
  scanSource.innerHTML = SOURCES.map(s=>`<option value="${s}">${s}</option>`).join('')
    + `<option value="__new__">➕ مصدر جديد…</option>`;
}
scanSource.addEventListener('change', ()=>{
  scanNewSourceField.style.display = scanSource.value === '__new__' ? 'block' : 'none';
});

function openScanSheet(){
  fillScanSourceSelect();
  scanDate.value = todayISO();
  scanNewSource.value = '';
  scanNewSourceField.style.display = 'none';
  scanOverlay.classList.add('show');
}
function closeScanSheet(){
  scanOverlay.classList.remove('show');
  scanInput.value = '';
}
document.getElementById('cancelScan').addEventListener('click', closeScanSheet);
scanOverlay.addEventListener('click', (e)=>{ if(e.target===scanOverlay) closeScanSheet(); });

function showScanLoading(msg){
  scanBody.innerHTML = `<div class="scan-loading"><div class="spinner"></div><p>${msg}</p></div>`;
}
function showScanError(msg){
  scanBody.innerHTML = `<div class="scan-error">⚠️ ${msg}</div>`;
}

function scanRowHTML(name, price){
  const id = 'row'+(scanRowId++);
  return `<div class="scan-row" data-id="${id}">
    <input type="text" class="row-name" value="${(name||'').replace(/"/g,'&quot;')}" placeholder="سمية السلعة">
    <input type="number" class="row-price" step="0.01" value="${price!=null && !isNaN(price) ? price : ''}" placeholder="الثمن">
    <button class="row-del" data-id="${id}">✕</button>
  </div>`;
}

function renderScanRows(items){
  const rowsHtml = items.map(it=>scanRowHTML(it.name, it.price)).join('');
  scanBody.innerHTML = `
    <p style="font-size:13px; color:var(--ink-soft); margin-top:0;">صحح السمية والثمن، أو حيد أي سطر غلط، قبل ما تحفظ:</p>
    <div id="scanRowsHolder">${rowsHtml || ''}</div>
  `;
  wireScanRowDeletes();
}

function wireScanRowDeletes(){
  scanBody.querySelectorAll('.row-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      btn.closest('.scan-row').remove();
    });
  });
}

document.getElementById('scanAddRow').addEventListener('click', ()=>{
  if(!document.getElementById('scanRowsHolder')){
    scanBody.innerHTML = `<p style="font-size:13px; color:var(--ink-soft); margin-top:0;">صحح السمية والثمن، أو حيد أي سطر غلط، قبل ما تحفظ:</p><div id="scanRowsHolder"></div>`;
  }
  document.getElementById('scanRowsHolder').insertAdjacentHTML('beforeend', scanRowHTML('', ''));
  wireScanRowDeletes();
});

// heuristic: pull a trailing price number off each OCR line, keep the rest as the name
function parseReceiptText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>1);
  const results = [];
  const priceRe = /(\d{1,4}[.,]\d{1,2}|\d{2,4})\s*(?:dh|DH|درهم|د\.م)?\s*$/;
  for(const line of lines){
    const m = line.match(priceRe);
    if(!m) continue;
    const priceStr = m[1].replace(',', '.');
    const price = parseFloat(priceStr);
    if(isNaN(price) || price <= 0 || price > 100000) continue;
    let name = line.slice(0, m.index).trim();
    name = name.replace(/[.\-–_*:،,]+$/,'').trim();
    if(name.length < 2) continue;
    results.push({name, price});
  }
  return results;
}

scanInput.addEventListener('change', async ()=>{
  const file = scanInput.files[0];
  if(!file) return;
  openScanSheet();
  showScanLoading('كنحمل محرك القراءة… (أول مرة كتاخد وقت)');

  if(typeof Tesseract === 'undefined'){
    showScanError('محرك القراءة ماقدرش يتحمل. تأكد من الاتصال بالأنترنت وعاود جرب.');
    return;
  }

  try{
    if(!ocrWorker){
      ocrWorker = await Tesseract.createWorker('ara');
    }
    showScanLoading('كنقرا النص من الصورة…');
    const { data: { text } } = await ocrWorker.recognize(file);
    const items = parseReceiptText(text);
    if(items.length === 0){
      scanBody.innerHTML = `<div class="scan-error">⚠️ ماقدرتش نجبد شي سلعة من الصورة. زيدها يدويا من الزر تحت.</div>`;
    } else {
      renderScanRows(items);
    }
  }catch(err){
    showScanError('وقع مشكل فقراءة الصورة. زيد السلع يدويا من الزر تحت.');
  }
});

document.getElementById('saveScan').addEventListener('click', ()=>{
  let source = scanSource.value;
  if(source === '__new__') source = scanNewSource.value.trim();
  if(!source){ (scanSource.value==='__new__' ? scanNewSource : scanSource).focus(); return; }
  const dateVal = scanDate.value ? isoToDMY(scanDate.value) : isoToDMY(todayISO());

  const rows = scanBody.querySelectorAll('.scan-row');
  let added = 0;
  rows.forEach(row=>{
    const name = row.querySelector('.row-name').value.trim();
    const price = parseFloat(row.querySelector('.row-price').value);
    if(!name || isNaN(price) || price < 0) return;
    customProducts.push({
      n: name, s: source, d: dateVal, p: price, custom: true,
      _id: 'c'+Date.now()+Math.random().toString(36).slice(2,7)
    });
    added++;
  });

  if(added === 0) return;

  saveCustom(customProducts);
  rebuildAll();
  renderChips();
  renderStamp();
  closeScanSheet();
  input.value = '';
  runSearch();
});

let debounceT;
input.addEventListener('input', ()=>{
  openKey = null;
  clearTimeout(debounceT);
  debounceT = setTimeout(runSearch, 80);
});
clearBtn.addEventListener('click', ()=>{
  input.value='';
  openKey=null;
  runSearch();
  input.focus();
});

runSearch();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
