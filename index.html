<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>دفتر أثمنة السلع</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1F4B46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر الأثمنة">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EA;
    --paper-2:#F3ECD9;
    --ink:#1F4B46;
    --ink-soft:#3F6B64;
    --mustard:#E4A538;
    --mustard-dark:#B97C1F;
    --up:#B23A2E;
    --down:#2F7D5B;
    --line: rgba(31,75,70,0.18);
    --shadow-ink: rgba(31,75,70,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal', system-ui, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(31,75,70,0.06) 1px, transparent 1px);
    background-size: 18px 18px;
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:18px 16px 48px;
  }

  header.top{
    padding:6px 2px 18px;
  }
  header.top .eyebrow-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }
  h1{
    font-size:26px;
    font-weight:800;
    margin:0;
    letter-spacing:0;
    color:var(--ink);
  }
  .stamp{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:500;
    white-space:nowrap;
    border:1px dashed var(--line);
    border-radius:100px;
    padding:3px 10px;
  }
  header.top p.sub{
    margin:6px 0 0;
    font-size:14.5px;
    color:var(--ink-soft);
    line-height:1.6;
  }

  .search-shell{
    position:sticky;
    top:12px;
    z-index:5;
    margin-top:16px;
  }
  .search-box{
    position:relative;
    background:#fff;
    border:2px solid var(--ink);
    border-radius:14px;
    box-shadow:3px 3px 0 var(--ink);
    display:flex;
    align-items:center;
    padding:0 14px;
  }
  .search-box svg{flex:0 0 auto; opacity:0.65;}
  .search-box input{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    font-family:inherit;
    font-size:18px;
    font-weight:500;
    color:var(--ink);
    padding:14px 10px;
    min-width:0;
  }
  .search-box input::placeholder{color:#9AAFA9;}
  .clear-btn{
    border:0;
    background:var(--paper-2);
    color:var(--ink-soft);
    width:26px;height:26px;
    border-radius:50%;
    font-size:15px;
    line-height:1;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .clear-btn.show{display:flex;}

  .filters{
    display:flex;
    gap:8px;
    margin-top:12px;
    overflow-x:auto;
    padding-bottom:4px;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:13.5px;
    font-weight:500;
    padding:7px 14px;
    border-radius:100px;
    cursor:pointer;
    white-space:nowrap;
  }
  .chip .dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    margin-inline-start:6px;
    vertical-align:middle;
  }
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }

  .status-line{
    margin:16px 2px 10px;
    font-size:14px;
    color:var(--ink-soft);
    font-weight:500;
    min-height:20px;
  }
  .status-line b{color:var(--ink); font-weight:700;}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:34px; display:block; margin-bottom:10px;}
  .empty-state p{margin:0; font-size:15px; line-height:1.7;}

  .results{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .tag{
    position:relative;
    background:#fff;
    border:1.5px solid var(--line);
    border-inline-start-width:6px;
    border-inline-start-color: var(--src-color, var(--ink));
    border-radius:10px;
    padding:13px 16px 13px 16px;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .tag:active{border-color:var(--ink); border-inline-start-color:var(--src-color, var(--ink));}
  .tag.open{border-color:var(--ink); border-inline-start-color:var(--src-color, var(--ink)); box-shadow:2px 2px 0 var(--shadow-ink);}

  .tag::before{
    content:"";
    position:absolute;
    inset-inline-start:-1.5px;
    top:50%;
    transform:translateY(-50%);
    width:11px;height:11px;
    background:var(--src-color, var(--paper));
    border:1.5px solid var(--paper);
    border-radius:50%;
  }

  .tag-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .tag-name{
    font-size:17.5px;
    font-weight:700;
    color:var(--ink);
    line-height:1.4;
  }
  .tag-price{
    font-size:24px;
    font-weight:800;
    font-variant-numeric: tabular-nums;
    letter-spacing:-0.3px;
    color:var(--ink);
    background:var(--mustard);
    padding:3px 12px;
    border-radius:8px;
    box-shadow:2px 2px 0 var(--shadow-ink);
    white-space:nowrap;
  }
  .tag-price small{font-size:11.5px; font-weight:600; color:var(--ink); opacity:0.75;}

  .hist-price span{ font-variant-numeric: tabular-nums; }

  .tag-meta{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:6px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .src-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .tag-meta .sep{opacity:0.4;}

  .history{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .tag.open .history{max-height:600px;}
  .history-inner{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
  }
  .history-title{
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .hist-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 0;
    font-size:13.5px;
  }
  .hist-row + .hist-row{border-top:1px solid rgba(31,75,70,0.08);}
  .hist-left{display:flex; align-items:center; gap:7px; color:var(--ink-soft);}
  .hist-price{display:flex; align-items:center; gap:6px; font-weight:800; font-size:15px; color:var(--ink);}
  .trend{font-size:12px; font-weight:800;}
  .trend.up{color:var(--up);}
  .trend.down{color:var(--down);}
  .trend.flat{color:#B7B09A;}

  .score-badge{
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
    background:var(--paper-2);
    border-radius:100px;
    padding:1px 8px;
  }

  footer.hint{
    text-align:center;
    margin-top:26px;
    font-size:12px;
    color:#A9A28A;
    line-height:1.8;
  }

  .fab{
    position:fixed;
    inset-inline-end:20px;
    bottom:22px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--mustard);
    border:2px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    color:var(--ink);
    font-size:28px;
    font-weight:800;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:20;
  }
  .fab:active{ transform:translateY(1px); box-shadow:2px 2px 0 var(--ink);}

  .sheet-overlay{
    position:fixed; inset:0;
    background:rgba(31,75,70,0.35);
    z-index:30;
    display:none;
    align-items:flex-end;
    justify-content:center;
  }
  .sheet-overlay.show{display:flex;}
  .sheet{
    width:100%;
    max-width:640px;
    background:var(--paper);
    border-radius:18px 18px 0 0;
    border:2px solid var(--ink);
    border-bottom:none;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:85vh;
    overflow-y:auto;
  }
  .sheet h2{
    margin:0 0 14px;
    font-size:18px;
    font-weight:800;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input, .field select{
    width:100%;
    font-family:inherit;
    font-size:15.5px;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:#fff;
    color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--mustard); border-color:var(--ink);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .btn{
    flex:1;
    padding:12px;
    border-radius:10px;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    border:2px solid var(--ink);
    cursor:pointer;
  }
  .btn.primary{background:var(--ink); color:#fff;}
  .btn.ghost{background:transparent; color:var(--ink);}

  .storage-warn{
    font-size:12px;
    color:var(--up);
    background:rgba(178,58,46,0.08);
    border:1px solid rgba(178,58,46,0.25);
    border-radius:8px;
    padding:8px 10px;
    margin-bottom:12px;
    line-height:1.6;
  }

  .custom-badge{
    font-size:10.5px;
    font-weight:700;
    color:var(--mustard-dark);
    background:rgba(228,165,56,0.15);
    border-radius:100px;
    padding:1px 8px;
  }
  .del-btn{
    border:0;
    background:transparent;
    color:var(--up);
    font-size:15px;
    cursor:pointer;
    padding:2px 4px;
    margin-inline-start:auto;
  }
  .edit-btn{
    border:0;
    background:transparent;
    font-size:15px;
    cursor:pointer;
    padding:2px 4px;
    opacity:0.75;
  }
  .hist-price .edit-btn{ margin-inline-start:6px; }
  .tag-price-wrap{
    display:flex;
    align-items:center;
    gap:2px;
  }
  .card-edit{ font-size:16px; }

  .scan-row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
  }
  .scan-row input[type="text"]{
    flex:1.4;
    font-family:inherit;
    font-size:14.5px;
    padding:9px 10px;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    min-width:0;
  }
  .scan-row input[type="number"]{
    flex:0.8;
    font-family:inherit;
    font-size:14.5px;
    padding:9px 10px;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    min-width:0;
  }
  .scan-row .row-del{
    flex:0 0 auto;
    border:0;
    background:transparent;
    color:var(--up);
    font-size:17px;
    cursor:pointer;
    padding:4px 6px;
  }
  .scan-loading{
    text-align:center;
    padding:26px 10px;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .spinner{
    width:30px;height:30px;
    border:3px solid var(--line);
    border-top-color:var(--ink);
    border-radius:50%;
    margin:0 auto 12px;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .scan-error{
    font-size:13.5px;
    color:var(--up);
    background:rgba(178,58,46,0.08);
    border:1px solid rgba(178,58,46,0.25);
    border-radius:8px;
    padding:10px 12px;
    line-height:1.7;
  }

  @media (min-width:520px){
    h1{font-size:29px;}
  }

  /* ===== MODERN PREMIUM UI ===== */
  :root{
    --paper:#f4f7f8;
    --paper-2:#e9eff1;
    --ink:#102a2b;
    --ink-soft:#607779;
    --mustard:#f4b740;
    --mustard-dark:#d89218;
    --up:#d94b57;
    --down:#21966f;
    --line:rgba(16,42,43,.10);
    --shadow-ink:rgba(16,42,43,.12);
  }
  body{
    background:
      radial-gradient(900px 420px at 100% -10%, rgba(67,184,161,.18), transparent 60%),
      radial-gradient(700px 380px at -10% 15%, rgba(93,126,255,.12), transparent 58%),
      linear-gradient(180deg,#f8fafb 0%,#eef3f4 100%);
  }
  body::before{opacity:.35;background-size:28px 28px;}
  .wrap{max-width:720px;padding:22px 14px 92px;}
  header.top{
    position:relative;
    padding:20px 18px 24px;
    margin-bottom:12px;
    border:1px solid rgba(255,255,255,.8);
    border-radius:28px;
    background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(255,255,255,.62));
    box-shadow:0 16px 45px rgba(24,54,57,.10), inset 0 1px 0 #fff;
    backdrop-filter:blur(18px);
    overflow:hidden;
  }
  header.top::after{
    content:"";position:absolute;width:150px;height:150px;border-radius:50%;
    background:linear-gradient(135deg,rgba(46,172,147,.22),rgba(91,113,255,.10));
    left:-60px;top:-70px;filter:blur(2px);pointer-events:none;
  }
  header.top .eyebrow-row{position:relative;z-index:1;align-items:center;}
  h1{font-size:29px;letter-spacing:-.5px;color:#102a2b;}
  .stamp{
    border:0;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700;
    color:#276d62;background:#e7f6f1;box-shadow:inset 0 0 0 1px rgba(39,109,98,.08);
  }
  header.top p.sub{position:relative;z-index:1;margin-top:9px;color:#6b7d7f;font-size:14px;line-height:1.7;}
  .search-shell{top:10px;margin-top:14px;}
  .search-box{
    min-height:62px;padding:0 16px;border:1px solid rgba(255,255,255,.95);border-radius:20px;
    background:rgba(255,255,255,.92);box-shadow:0 14px 32px rgba(16,42,43,.12),0 0 0 5px rgba(255,255,255,.22);
    backdrop-filter:blur(16px);
  }
  .search-box:focus-within{border-color:rgba(42,150,128,.45);box-shadow:0 16px 35px rgba(16,42,43,.13),0 0 0 5px rgba(42,150,128,.08);}
  .search-box input{font-size:18px;padding:16px 10px;color:#153637;}
  .search-box input::placeholder{color:#9aabad;}
  .clear-btn{border-radius:50%;width:34px;height:34px;}
  .filters{gap:8px;padding:13px 2px 8px;}
  .chip{
    border:1px solid rgba(16,42,43,.08);background:rgba(255,255,255,.72);color:#5c7072;
    border-radius:999px;padding:9px 13px;font-size:13px;font-weight:700;
    box-shadow:0 4px 12px rgba(16,42,43,.05);transition:.18s ease;
  }
  .chip.active{background:#102a2b;color:#fff;border-color:#102a2b;box-shadow:0 7px 18px rgba(16,42,43,.16);}
  .chip .dot{width:7px;height:7px;margin-inline-start:7px;box-shadow:0 0 0 3px rgba(255,255,255,.35);}
  .status-line{padding:9px 5px 12px;color:#718284;font-size:12px;}
  .status-line b{color:#173738;}
  .results{display:grid;gap:10px;}
  .tag{
    border:1px solid rgba(255,255,255,.9);border-radius:20px;background:rgba(255,255,255,.82);
    box-shadow:0 8px 24px rgba(16,42,43,.07);overflow:hidden;position:relative;
    backdrop-filter:blur(10px);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
  }
  .tag:active{transform:scale(.992);}
  .tag.open{box-shadow:0 13px 30px rgba(16,42,43,.11);border-color:rgba(16,42,43,.12);}
  .tag::before{width:4px;left:auto;right:0;opacity:.95;}
  .tag-row{min-height:76px;padding:14px 17px 14px 15px;gap:10px;}
  .tag-name{font-size:16px;font-weight:800;color:#173738;line-height:1.45;}
  .tag-price-wrap{gap:4px;}
  .tag-price{font-size:18px;font-weight:900;color:#102a2b;white-space:nowrap;}
  .tag-price small{font-size:10px;color:#728486;}
  .tag-meta{margin-top:5px;font-size:11px;color:#809091;}
  .src-dot{width:7px;height:7px;box-shadow:0 0 0 3px rgba(16,42,43,.035);}
  .history{background:linear-gradient(180deg,rgba(244,248,248,.85),rgba(236,243,243,.9));border-top:1px solid rgba(16,42,43,.06);}
  .history-inner{padding:14px 16px 16px;}
  .history-title{font-size:12px;color:#718486;font-weight:800;margin-bottom:9px;}
  .hist-row{padding:10px 0;}
  .hist-left{font-size:11px;}
  .hist-price{font-size:14px;}
  .trend{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(16,42,43,.05);}
  .custom-badge{border:0;background:#edf3f3;border-radius:999px;padding:3px 7px;font-size:9px;}
  .score-badge{background:#edf7f4;border:0;box-shadow:none;}
  .empty-state{border:1px dashed rgba(16,42,43,.14);border-radius:20px;background:rgba(255,255,255,.55);padding:34px 18px;}
  .empty-state .glyph{font-size:38px;}
  .hint{color:#8a999a;font-size:11px;margin-top:22px;text-align:center;}
  .fab{
    width:58px;height:58px;right:18px;bottom:20px;border:1px solid rgba(255,255,255,.35);
    background:linear-gradient(135deg,#153c3d,#287e70);color:#fff;font-size:31px;font-weight:400;
    border-radius:19px;box-shadow:0 13px 28px rgba(16,42,43,.23),inset 0 1px 0 rgba(255,255,255,.25);
  }
  .sheet-overlay{background:rgba(7,24,25,.38);backdrop-filter:blur(7px);}
  .sheet{border:1px solid rgba(255,255,255,.9);background:rgba(250,252,252,.96);border-radius:28px 28px 0 0;box-shadow:0 -20px 55px rgba(8,27,29,.22);padding:22px 18px 28px;}
  .sheet h2{font-size:21px;color:#173738;}
  .field label{font-size:12px;color:#6b7d7f;font-weight:800;}
  .field input,.field select{border:1px solid rgba(16,42,43,.10);background:#fff;border-radius:14px;padding:13px 12px;}
  .field input:focus,.field select:focus{outline:3px solid rgba(42,150,128,.12);border-color:#2a967f;}
  .btn{border-radius:14px;padding:12px 16px;font-weight:800;}
  .btn.primary{background:#153c3d;box-shadow:0 8px 18px rgba(21,60,61,.18);}
  .btn.ghost{background:#edf2f2;}
  @media(max-width:430px){h1{font-size:25px}.wrap{padding-left:11px;padding-right:11px}.tag-row{min-height:72px}.tag-name{font-size:15px}.tag-price{font-size:17px}}


  /* ===== PRODUCT CARDS: STRONG-TO-LIGHT SOURCE GRADIENT ===== */
  .tag{
    background:
      linear-gradient(270deg,
        color-mix(in srgb, var(--src-color, #2f8f83) 34%, white) 0%,
        color-mix(in srgb, var(--src-color, #2f8f83) 18%, white) 42%,
        rgba(255,255,255,.96) 100%
      );
    border-color:color-mix(in srgb, var(--src-color, #2f8f83) 18%, white);
  }
  .tag:hover{
    background:
      linear-gradient(270deg,
        color-mix(in srgb, var(--src-color, #2f8f83) 42%, white) 0%,
        color-mix(in srgb, var(--src-color, #2f8f83) 22%, white) 45%,
        rgba(255,255,255,.98) 100%
      );
  }
  .tag.open{
    background:
      linear-gradient(270deg,
        color-mix(in srgb, var(--src-color, #2f8f83) 38%, white) 0%,
        color-mix(in srgb, var(--src-color, #2f8f83) 19%, white) 48%,
        rgba(255,255,255,.97) 100%
      );
  }

/* ===== BON IMPORT / OCR ===== */

// ---- date helpers ----
function parseDate(d){
  if(!d || d === '?') return null;
  const m = d.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return null;
  return new Date(+m[3], +m[2]-1, +m[1]);
}

// ---- Arabic normalization, mirroring the workbook's own logic ----
function normalize(str){
  return String(str)
    .trim()
    .replace(/[أإآ]/g,'ا')
    .replace(/[ىی]/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/ط/g,'ت')
    .replace(/ک/g,'ك')
    .replace(/\s+/g,'');
}

function bigrams(s){
  const map = new Map();
  for(let i=0;i<s.length-1;i++){
    const g = s.substr(i,2);
    map.set(g, (map.get(g)||0)+1);
  }
  return map;
}
function diceScore(a,b){
  if(a.length<2 || b.length<2) return a===b ? 100 : 0;
  const ba = bigrams(a), bb = bigrams(b);
  let inter = 0;
  for(const [g,c] of ba){
    if(bb.has(g)) inter += Math.min(c, bb.get(g));
  }
  return Math.round(2*inter/((a.length-1)+(b.length-1))*100);
}

function scoreOf(query, itemNorm){
  if(!query) return 0;
  if(query === itemNorm) return 100;
  if(itemNorm.includes(query)){
    return Math.min(99, 90 + (query.length/Math.max(itemNorm.length,1))*9);
  }
  if(itemNorm.length>=3 && query.includes(itemNorm)){
    return Math.min(94, 85 + (itemNorm.length/Math.max(query.length,1))*9);
  }
  return diceScore(query, itemNorm);
}

let ALL = [];
let SOURCES = [];
let SOURCE_COLORS = {};

function buildDisplayRecord(src, uid){
  const ov = edits[uid];
  const n = (ov && ov.n !== undefined) ? ov.n : src.n;
  const s = (ov && ov.s !== undefined) ? ov.s : src.s;
  const d = (ov && ov.d !== undefined) ? ov.d : src.d;
  const p = (ov && ov.p !== undefined) ? ov.p : src.p;
  return {
    n, s, d, p,
    custom: !!src.custom,
    _uid: uid,
    _edited: !!ov,
    _dt: parseDate(d),
    _norm: normalize(n)
  };
}

function rebuildAll(){
  ALL = [];
  DATA.forEach((src, i) => ALL.push(buildDisplayRecord(src, 'b'+i)));
  customProducts.forEach((src) => ALL.push(buildDisplayRecord(src, src._id)));
  SOURCES = [...new Set(ALL.map(x=>x.s))];
  SOURCE_COLORS = {};
  SOURCES.forEach((s,i)=>SOURCE_COLORS[s]=palette[i%palette.length]);
}

    return `<button class="chip ${activeSource===o.key?'active':''}" data-key="${o.key}">${o.label}${dot}</button>`;
  }).join('');
}
renderChips();
filtersEl.addEventListener('click', e=>{

// ---- stats stamp ----
function renderStamp(){
  const latestDate = ALL.reduce((acc,x)=> (x._dt && (!acc || x._dt>acc)) ? x._dt : acc, null);
  document.getElementById('statsStamp').textContent = latestDate
    ? `آخر تحديث ${String(latestDate.getDate()).padStart(2,'0')}/${String(latestDate.getMonth()+1).padStart(2,'0')}/${latestDate.getFullYear()}`

// ---- search + render ----
const input = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const statusLine = document.getElementById('statusLine');
const holder = document.getElementById('resultsHolder');
let openKey = null;

function fmtPrice(p){
  const n = Number(p);
  if(Number.isInteger(n)) return n.toString();
  return n.toFixed(2);
}

function historyFor(name){
  return ALL.filter(x=>x.n===name)
    .slice()
    .sort((a,b)=>{
      if(a._dt && b._dt) return b._dt - a._dt;
      if(a._dt) return -1;
      if(b._dt) return 1;
      return 0;
    });
}

function renderHistory(name){
  const rows = historyFor(name);
  let html = `<div class="history-inner"><p class="history-title">تاريخ الأثمنة (${rows.length})</p>`;
  rows.forEach((r,i)=>{
    let trendHtml = '';
    if(i < rows.length-1){
      const prev = rows[i+1].p;
      if(r.p > prev) trendHtml = `<span class="trend up">▲</span>`;
      else if(r.p < prev) trendHtml = `<span class="trend down">▼</span>`;
      else trendHtml = `<span class="trend flat">–</span>`;
    }
    const delBtn = r.custom ? `<button class="del-btn" data-uid="${r._uid}" title="حذف">🗑</button>` : '';
    const editBtn = `<button class="edit-btn" data-uid="${r._uid}" title="عدل">✏️</button>`;
    html += `<div class="hist-row">
      <div class="hist-left">
        <span class="src-dot" style="background:${SOURCE_COLORS[r.s]}"></span>
        <span>${r.s}</span><span class="sep">·</span><span>${r.d==='?'?'بلا تاريخ':r.d}</span>
        ${r.custom ? '<span class="custom-badge">زدتيها نتا</span>' : ''}
        ${r._edited ? '<span class="custom-badge">معدلة</span>' : ''}
      </div>
      <div class="hist-price">${trendHtml}<span>${fmtPrice(r.p)} درهم</span>${editBtn}${delBtn}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function render(list, query){
  if(list.length===0){
    if(query){
      statusLine.innerHTML = `❌ ماكاينش نتيجة قريبة من «${query}»`;
      holder.innerHTML = `<div class="empty-state"><span class="glyph">🤷‍♂️</span><p>جرب تكتب سمية أقصر، أو تأكد من الكتابة.</p></div>`;
    } else {
      statusLine.textContent = '';
      holder.innerHTML = `<div class="empty-state"><span class="glyph">📭</span><p>ماكايناش سلع فهاد الفلتر.</p></div>`;
    }
    return;
  }
  statusLine.innerHTML = query
    ? `✅ كاين <b>${list.length}</b> سلعة قريبة من البحث`
    : `📦 عارض ليك <b>${list.length}</b> سلعة`;
  holder.innerHTML = `<div class="results">${list.map((r,idx)=>{
    const key = r.n+'|'+r.s+'|'+r.d+'|'+idx;
    const isOpen = openKey===r.n;
    return `<div class="tag ${isOpen?'open':''}" data-name="${encodeURIComponent(r.n)}" style="--src-color:${SOURCE_COLORS[r.s]}">
      <div class="tag-row">
        <span class="tag-name">${r.n}</span>
        <span class="tag-price-wrap">
          <button class="edit-btn card-edit" data-uid="${r._uid}" title="عدل">✏️</button>
          <span class="tag-price">${fmtPrice(r.p)}<small> درهم</small></span>
        </span>
      </div>
      <div class="tag-meta">
        <span class="src-dot" style="background:${SOURCE_COLORS[r.s]}"></span>
        <span>${r.s}</span>
        <span class="sep">·</span>
        <span>${r.d==='?'?'بلا تاريخ':r.d}</span>
        ${r.custom ? '<span class="custom-badge">زدتيها نتا</span>' : ''}
        ${r._edited ? '<span class="custom-badge">معدلة</span>' : ''}
      </div>
      <div class="history">${isOpen ? renderHistory(r.n) : ''}</div>
    </div>`;
  }).join('')}</div>`;

  holder.querySelectorAll('.tag').forEach(el=>{
    el.addEventListener('click', ()=>{
      const name = decodeURIComponent(el.dataset.name);
      openKey = (openKey===name) ? null : name;
      runSearch();
    });
  });

  holder.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const uid = btn.dataset.uid;
      deleteCustomById(uid);
    });
  });

  holder.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const uid = btn.dataset.uid;
      const rec = ALL.find(x=>x._uid===uid);
      if(rec) openEditSheet(rec);
    });
  });
}

function deleteCustomById(uid){
  customProducts = customProducts.filter(x=>x._id !== uid);
  saveCustom(customProducts);
  rebuildAll();
  renderChips();
  renderStamp();
  runSearch();
}

function byDateDesc(a,b){
  const ad = a._dt ? a._dt.getTime() : -Infinity;
  const bd = b._dt ? b._dt.getTime() : -Infinity;
  return bd - ad;
}

// keep only the most recent entry per exact product name, so the same
// product doesn't repeat once per price-history date in the main list
function dedupeLatest(list){
  const map = new Map();
  for(const r of list){
    const prev = map.get(r.n);
    if(!prev){
      map.set(r.n, r);
      continue;
    }
    const rd = r._dt ? r._dt.getTime() : -Infinity;
    const pd = prev._dt ? prev._dt.getTime() : -Infinity;
    if(rd > pd) map.set(r.n, r);
  }
  return Array.from(map.values());
}

function runSearch(){
  const raw = input.value;
  clearBtn.classList.toggle('show', !!raw);
  const query = normalize(raw);

  let pool = ALL;
  if(activeSource!=='الكل') pool = pool.filter(x=>x.s===activeSource);

  if(!query){
    const all = dedupeLatest(pool).sort(byDateDesc);
    render(all, '');
    return;
  }

  const scored = pool.map(x=>({...x, _score: scoreOf(query, x._norm)}))
    .filter(x=>x._score>=40);

  const deduped = dedupeLatest(scored);

  deduped.sort((a,b)=>{
    if(b._score !== a._score) return b._score - a._score;
    return byDateDesc(a,b);
  });

  render(deduped.slice(0,60), raw.trim());
}

// ---- add / edit product sheet ----
const fab = document.getElementById('fabAdd');
const overlay = document.getElementById('sheetOverlay');
const sheetTitle = document.getElementById('sheetTitle');
const fName = document.getElementById('fName');
const fPrice = document.getElementById('fPrice');
const fDate = document.getElementById('fDate');
const fSource = document.getElementById('fSource');
const newSourceField = document.getElementById('newSourceField');
const fNewSource = document.getElementById('fNewSource');
const storageWarnHolder = document.getElementById('storageWarnHolder');

let editingUid = null;

function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isoToDMY(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function dmyToISO(dmy){
  const m = dmy.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return todayISO();
  return `${m[3]}-${m[2]}-${m[1]}`;
}

function fillSourceSelect(currentSource){
  fSource.innerHTML = SOURCES.map(s=>`<option value="${s}">${s}</option>`).join('')
    + `<option value="__new__">➕ مصدر جديد…</option>`;
  if(currentSource && SOURCES.includes(currentSource)) fSource.value = currentSource;
}

function openSheet(){
  editingUid = null;
  sheetTitle.textContent = '➕ زيد سلعة جديدة';
  document.getElementById('saveAdd').textContent = 'حفظ';
  fillSourceSelect();
  fName.value = '';
  fPrice.value = '';
  fDate.value = todayISO();
  fNewSource.value = '';
  newSourceField.style.display = 'none';
  storageWarnHolder.innerHTML = storageOK ? '' :
    `<div class="storage-warn">⚠️ التخزين مقفول فهاد المتصفح، السلع اللي غادي تزيد غادي تضيع ملي تسد الصفحة.</div>`;
  overlay.classList.add('show');
  setTimeout(()=>fName.focus(), 50);
}

function openEditSheet(rec){
  editingUid = rec._uid;
  sheetTitle.textContent = '✏️ عدل السلعة';
  document.getElementById('saveAdd').textContent = 'حفظ التعديل';
  fillSourceSelect(rec.s);
  fName.value = rec.n;
  fPrice.value = rec.p;
  fDate.value = dmyToISO(rec.d);
  fNewSource.value = '';
  newSourceField.style.display = 'none';
  storageWarnHolder.innerHTML = storageOK ? '' :
    `<div class="storage-warn">⚠️ التخزين مقفول فهاد المتصفح، التعديل ماغاديش يتحفظ.</div>`;
  overlay.classList.add('show');
  setTimeout(()=>fName.focus(), 50);
}

function closeSheet(){ overlay.classList.remove('show'); editingUid = null; }

fab.addEventListener('click', openSheet);
document.getElementById('cancelAdd').addEventListener('click', closeSheet);
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeSheet(); });

fSource.addEventListener('change', ()=>{
  newSourceField.style.display = fSource.value === '__new__' ? 'block' : 'none';
  if(fSource.value === '__new__') fNewSource.focus();
});

document.getElementById('saveAdd').addEventListener('click', ()=>{
  const name = fName.value.trim();
  const price = parseFloat(fPrice.value);
  let source = fSource.value;
  if(source === '__new__'){
    source = fNewSource.value.trim();
  }
  if(!name){ fName.focus(); return; }
  if(isNaN(price) || price < 0){ fPrice.focus(); return; }
  if(!source){ fNewSource.focus(); return; }

  const dateVal = fDate.value ? isoToDMY(fDate.value) : isoToDMY(todayISO());

  if(editingUid){
    if(editingUid.startsWith('c')){
      const rec = customProducts.find(x=>x._id===editingUid);
      if(rec){ rec.n = name; rec.s = source; rec.d = dateVal; rec.p = price; }
      saveCustom(customProducts);
    } else {
      edits[editingUid] = { n: name, s: source, d: dateVal, p: price };
      saveEdits(edits);
    }
    rebuildAll();
    renderChips();
    renderStamp();
    closeSheet();
    input.value = '';
    openKey = name;
    runSearch();
    return;
  }

  const rec = {
    n: name,
    s: source,
    d: dateVal,
    p: price,
    custom: true,
    _id: 'c'+Date.now()+Math.random().toString(36).slice(2,7)
  };
  customProducts.push(rec);
  saveCustom(customProducts);
  rebuildAll();
  renderChips();
  renderStamp();
  closeSheet();
  input.value = '';
  openKey = name;
  runSearch();
});


let debounceT;
input.addEventListener('input', ()=>{
  openKey = null;
  clearTimeout(debounceT);
  debounceT = setTimeout(runSearch, 80);
});
clearBtn.addEventListener('click', ()=>{
  input.value='';
  openKey=null;
  runSearch();
  input.focus();
});

runSearch();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}


/* ===== BON CAMERA + OCR WORKFLOW ===== */
const bonImportBtn=document.getElementById('bonImportBtn');
const bonOverlay=document.getElementById('bonOverlay');
const bonClose=document.getElementById('bonClose');
const bonFile=document.getElementById('bonFile');
const bonPreview=document.getElementById('bonPreview');
const bonPreviewImg=document.getElementById('bonPreviewImg');
const bonOcrBtn=document.getElementById('bonOcrBtn');
const bonBackupBtn=document.getElementById('bonBackupBtn');
const bonStatus=document.getElementById('bonStatus');
const bonText=document.getElementById('bonText');
const bonRows=document.getElementById('bonRows');
const bonConfig=document.getElementById('bonConfig');
const bonDate=document.getElementById('bonDate');
const bonSource=document.getElementById('bonSource');
const bonSaveAll=document.getElementById('bonSaveAll');
let bonFiles=[], bonCurrentIndex=0, bonParsed=[];

function bonToday(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function bonSetStatus(t){ bonStatus.textContent=t; bonStatus.style.display='block'; }
function bonOpen(){ bonOverlay.classList.add('show'); bonDate.value=bonToday(); fillBonSource(); bonFiles=[]; bonCurrentIndex=0; bonParsed=[]; bonQueue.innerHTML=''; bonPreviewImg.style.display='none'; bonConfig.style.display='none'; bonText.style.display='none'; bonRows.style.display='none'; bonSaveAll.style.display='none'; }
function bonCloseModal(){ bonOverlay.classList.remove('show'); }
function fillBonSource(){
  const opts=(typeof SOURCES!=='undefined'?SOURCES:['سلعة الباز','سلعة الهري','سلعة الحانوت الجديد']);
  bonSource.innerHTML=opts.map(x=>`<option value="${x}">${x}</option>`).join('');
  if(opts.includes('سلعة الباز')) bonSource.value='سلعة الباز';
}
bonImportBtn.addEventListener('click',bonOpen); bonClose.addEventListener('click',bonCloseModal);
bonOverlay.addEventListener('click',e=>{if(e.target===bonOverlay)bonCloseModal()});
bonFile.addEventListener('change',e=>{
  bonFiles=[...(e.target.files||[])]; if(!bonFiles.length)return;
  bonCurrentIndex=0; bonParsed=[];
  bonQueue.innerHTML=bonFiles.map((f,i)=>`<div class="bon-q-item" data-q="${i}">📄 ${f.name}</div>`).join('');
  const first=bonFiles[0]; bonPreviewImg.src=URL.createObjectURL(first); bonPreviewImg.style.display='block'; bonConfig.style.display='grid'; bonOcrBtn.disabled=false;
  bonSetStatus(`📚 اخترتي ${bonFiles.length} بون${bonFiles.length>1?'ات':''}. غادي نقراهم واحد بواحد.`); bonText.value=''; bonText.style.display='none'; bonRows.style.display='none'; bonSaveAll.style.display='none';
});

async function loadTesseract(){
  if(window.Tesseract) return window.Tesseract;
  return new Promise((resolve,reject)=>{
    const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'; sc.onload=()=>resolve(window.Tesseract); sc.onerror=()=>reject(new Error('تعذر تحميل محرك OCR')); document.head.appendChild(sc);
  });
}
function normalizeDigits(s){const a='٠١٢٣٤٥٦٧٨٩';return s.replace(/[٠-٩]/g,c=>String(a.indexOf(c)))}
function parseBonText(text){
  const lines=normalizeDigits(text).split(/\n+/).map(x=>x.trim()).filter(Boolean), out=[];
  // OCR in invoices is imperfect; identify lines containing a plausible unit price and keep the rest as product text.
  for(const line of lines){
    const nums=[...line.matchAll(/(?:^|\s)(\d{1,6}(?:[.,]\d{1,2})?)(?=\s|$)/g)].map(m=>m[1]);
    if(!nums.length) continue;
    const priceRaw=nums[nums.length-1];
    const price=parseFloat(priceRaw.replace(',','.'));
    if(!Number.isFinite(price) || price<=0) continue;
    let name=line.replace(priceRaw,' ').replace(/^[\s\d.\-–—×xX]+/,'').replace(/\s+/g,' ').trim();
    name=name.replace(/\b\d{1,3}\b/g,' ').replace(/\s+/g,' ').trim();
    if(name.length<2) continue;
    if(/^(bon|date|réf|ref|commande|total|المجموع|التاريخ|العدد|الثمن|البضاعة|المجموع)$/i.test(name)) continue;
    out.push({n:name,p:price});
  }
  const seen=new Set(); return out.filter(x=>{const k=x.n+'|'+x.p;if(seen.has(k))return false;seen.add(k);return true}).slice(0,100);
}
function renderBonRows(rows){
  bonParsed=rows; bonRows.innerHTML='';
  if(!rows.length){bonRows.innerHTML='<div class="bon-empty">ماقدرتش نستخرج السلع بشكل موثوق. راجع النص المقروء أو دخل السلع يدوياً من «زيد سلعة».</div>';bonRows.style.display='block';bonSaveAll.style.display='none';return;}
  rows.forEach((r,i)=>{const el=document.createElement('div');el.className='bon-row';el.innerHTML=`<input class="bon-name" data-i="${i}" value="${String(r.n).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><input class="bon-price" data-i="${i}" inputmode="decimal" value="${r.p}">`;bonRows.appendChild(el)});
  bonRows.style.display='block'; bonSaveAll.style.display='block';
}
bonOcrBtn.addEventListener('click',async()=>{
  if(!bonFiles.length)return; bonOcrBtn.disabled=true; bonParsed=[];
  try{
    const T=await loadTesseract();
    for(let i=0;i<bonFiles.length;i++){
      bonCurrentIndex=i; const f=bonFiles[i];
      document.querySelectorAll('.bon-q-item').forEach((el,j)=>el.classList.toggle('active',j===i));
      bonPreviewImg.src=URL.createObjectURL(f); bonPreviewImg.style.display='block';
      bonSetStatus(`⏳ كنقرا البون ${i+1} من ${bonFiles.length}: ${f.name}`);
      const {data}=await T.recognize(f,'ara+fra+eng',{logger:m=>{if(m.status==='recognizing text'&&m.progress)bonSetStatus(`⏳ البون ${i+1}/${bonFiles.length}… ${Math.round(m.progress*100)}%`)}});
      const text=data.text||''; bonParsed.push(...parseBonText(text).map(r=>({...r,_bon:i+1,_file:f.name})));
      if(i===0) bonText.value=text; else bonText.value += `\n\n===== ${f.name} =====\n${text}`;
      bonText.style.display='block'; renderBonRows(bonParsed);
    }
    bonSetStatus(`✅ سالات القراءة: ${bonFiles.length} بون، ولقينا ${bonParsed.length} سطر قابل للمراجعة.`);
  }catch(e){bonSetStatus('❌ وقع مشكل فقراءة واحد من البونات. تأكد من الإنترنت وحاول من جديد.');}
  bonOcrBtn.disabled=false;
});
bonText.addEventListener('input',()=>{ const rows=parseBonText(bonText.value); renderBonRows(rows); });
bonSaveAll.addEventListener('click',()=>{
  const names=[...bonRows.querySelectorAll('.bon-name')], prices=[...bonRows.querySelectorAll('.bon-price')]; const source=bonSource.value; const date=bonDate.value?isoToDMY(bonDate.value):isoToDMY(bonToday()); const added=[];
  names.forEach((el,i)=>{const n=el.value.trim(),p=parseFloat((prices[i]?.value||'').replace(',','.'));if(n&&Number.isFinite(p)&&p>=0)added.push({n,s:source,d:date,p,custom:true,_id:'c'+Date.now()+Math.random().toString(36).slice(2,8)})});
  if(!added.length){bonSetStatus('⚠️ ماكاين حتى سطر صالح للحفظ.');return;}
  customProducts.push(...added); saveCustom(customProducts); rebuildAll(); renderChips(); renderStamp(); input.value=''; runSearch(); bonSetStatus(`✅ تزادو ${added.length} سلع بنجاح فالتطبيق.`); bonSaveAll.style.display='none';
});
bonBackupBtn.addEventListener('click',()=>{
  try{
    const payload={app:'دفتر أثمنة السلع',exportedAt:new Date().toISOString(),customProducts:(typeof customProducts!=='undefined'?customProducts:[]),edits:(typeof edits!=='undefined'?edits:{})};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}), url=URL.createObjectURL(blob), a=document.createElement('a');a.href=url;a.download='backup-athmana-'+bonToday()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);bonSetStatus('💾 تدار النسخ الاحتياطي ديال السلع اللي زدتي.');
  }catch(e){bonSetStatus('❌ تعذر إنشاء النسخ الاحتياطي.');}
});
